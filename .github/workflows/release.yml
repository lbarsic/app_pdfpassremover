name: Release portable app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build portable exe
        run: pyinstaller PDF_Unlocker.spec --noconfirm --clean

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF_Unlocker
          path: dist/PDF_Unlocker.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: PDF Password Remover ${{ github.ref_name }}
          files: dist/PDF_Unlocker.exe
          fail_on_unmatched_files: true
          generate_release_notes: false
          body: |
            Portable Windows x64 app. No install, no Python, no build.

            1. Download `PDF_Unlocker.exe`
            2. Copy it anywhere
            3. Double-click to run
